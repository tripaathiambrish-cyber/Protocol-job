<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout & Support</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            margin: 40px auto;
            padding: 24px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --primary-hover: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            --shadow-premium: 0 12px 30px -5px rgba(79, 70, 229, 0.5);
        }

        /* Bada aur Premium Pay Button Styling */
        .pay-btn, #payButton, .payment-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 24px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #ffffff;
            background: var(--primary-gradient);
            border: none;
            border-radius: 14px;
            box-shadow: var(--shadow-premium);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .pay-btn:hover, #payButton:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .ticket-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .float-support {
            position: fixed;
            right: 12px;
            bottom: 12px;
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            z-index: 1000;
        }
    </style>
</head>
    <body>

    <div class="main-container">
        <h2>Checkout Portal</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-top: 5px;">Complete your transaction securely.</p>

        <!-- Ticket Actions Section -->
        <div id="ticketActions" class="ticket-actions">
            <!-- Bada aur Premium Pay Button -->
            <button type="button" id="payButton" class="pay-btn">
                <span>Pay Now (Secure)</span>
            </button>
        </div>
    </div>

    <!-- Floating Support Widget -->
    <div class="float-support">
        Support
    </div>
            <script>
    /*
     * Automatically hide the ticket action buttons
     * when there is no saved ticket.
     */

    function updateTicketActions(){
        const actions = document.getElementById("ticketActions");
        const ticketId = localStorage.getItem("protocol_ticket_id");

        if(actions){
            actions.style.display = ticketId ? "flex" : "none";
        }
    }

    updateTicketActions();

    /*
     * Update buttons whenever localStorage changes.
     */
    window.addEventListener(
        "storage",
        updateTicketActions
    );

    /*
     * Keep ticket actions visible after
     * a ticket is successfully created.
     */
    const originalSetItem = localStorage.setItem;

    localStorage.setItem = function(key, value){
        originalSetItem.call(this, key, value);

        if(key === "protocol_ticket_id"){
            updateTicketActions();
        }
    };
    </script>

</body>
</html>
