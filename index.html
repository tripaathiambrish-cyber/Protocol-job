<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Membership Portal - ProtocolJob</title>
    <!-- PWA Meta Tags for Mobile Installation -->
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg-deep: #090d16;
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(14, 165, 233, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .main-container {
            width: 100%; max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 24px; border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .top-header-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px;
        }

        .wallet-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399; padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 700; white-space: nowrap;
        }

        .step-box { display: none; }
        .step-box.active { display: block; }

        .telegram-banner {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: #ffffff; padding: 12px 16px; border-radius: 14px;
            font-size: 14px; font-weight: 700; margin-bottom: 16px;
            text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px;
            text-decoration: none; box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
        }

        .promo-section {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px; border-radius: 14px; margin-bottom: 16px;
        }

        .promo-row { display: flex; gap: 8px; margin-top: 6px; }
        .promo-input {
            flex: 1; padding: 10px 12px; font-size: 13px;
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px; color: #fff; outline: none;
        }
        .promo-btn {
            padding: 10px 16px; background: #f59e0b; color: #000;
            font-weight: 700; font-size: 13px; border: none; border-radius: 10px; cursor: pointer;
        }

        h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #ffffff; text-align: center; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; text-align: center; }
        
        input {
            width: 100%; padding: 14px 16px; background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; color: #fff; font-size: 15px; outline: none;
        }
        
        .plan-category {
            font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
            color: #38bdf8; margin: 20px 0 10px 0; display: flex; align-items: center; gap: 10px;
        }
        .plan-category::after { content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1); }

        .plan-card {
            background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .plan-info .price { font-size: 16px; font-weight: 800; color: #ffffff; }
        .plan-info .type { font-size: 12px; color: #34d399; font-weight: 600; margin-top: 2px; }
        
        .primary-btn {
            width: 100%; padding: 14px; font-size: 15px; font-weight: 700; color: #ffffff;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none; border-radius: 14px; cursor: pointer; text-align: center; text-decoration: none; display: inline-block;
        }
        .pay-now-btn {
            padding: 10px 16px; font-size: 13px; font-weight: 700; color: #ffffff;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none; border-radius: 12px; text-decoration: none; white-space: nowrap;
        }
    </style>
</head>
    <body>
    <div class="main-container">
        
        <!-- STEP 1: USER LOGIN FORM -->
        <div id="stepForm" class="step-box active">
            <h2>Welcome</h2>
            <p class="subtitle">Enter your details to view membership plans.</p>
            <form id="userForm" onsubmit="submitForm(event)">
                <div style="margin-bottom: 16px;">
                    <label style="font-size: 12px; color: #cbd5e1; margin-bottom: 8px; display: block;">NAME</label>
                    <input type="text" id="userName" placeholder="Enter your full name" required>
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="font-size: 12px; color: #cbd5e1; margin-bottom: 8px; display: block;">PHONE NUMBER</label>
                    <input type="tel" id="userPhone" placeholder="Enter phone number" required>
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="font-size: 12px; color: #cbd5e1; margin-bottom: 8px; display: block;">EMAIL ID</label>
                    <input type="email" id="userEmail" placeholder="Enter email address" required>
                </div>
                <button type="submit" class="primary-btn">Submit & Proceed</button>
            </form>
        </div>

        <!-- STEP 2: MEMBERSHIP & PAYMENT PAGE -->
        <div id="stepPayment" class="step-box">
            
            <div class="top-header-row">
                <div style="background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; padding: 6px 10px; border-radius: 10px; font-size: 11px; font-weight: 600;">
                    ⭐ Trusted by 50k+ users
                </div>
                <div class="wallet-badge">
                    <span>💰 Wallet: <span id="walletBalance">₹0</span></span>
                </div>
            </div>

            <!-- Prominent Telegram Channel Banner -->
            <a href="https://t.me/protocoljob" target="_blank" class="telegram-banner">
                📢 Join Official Telegram Channel
            </a>

            <!-- Dynamic Promo Code Box -->
            <div class="promo-section">
                <label style="font-size: 11px; margin-bottom: 4px; display: block; color: #cbd5e1;">Have a Promo Code? (Get Bonus)</label>
                <div class="promo-row">
                    <input type="text" id="promoInput" class="promo-input" placeholder="Enter code (e.g. PROTOINDIA)">
                    <button type="button" class="promo-btn" onclick="applyPromoCode()">Apply</button>
                </div>
            </div>

            <h2>Membership Plans</h2>
            <p class="subtitle">Choose your preferred plan below.</p>

            <div class="plan-category">Weekly Membership</div>
            <div class="plan-card">
                <div class="plan-info">
                    <div class="price">Pay ₹600</div>
                    <div class="type">Get ₹2200 Weekly</div>
                </div>
                <a href="https://rzp.io/rzp/hQ4qOK4" target="_blank" class="pay-now-btn">Pay Now</a>
            </div>
            
            <div class="plan-card">
                <div class="plan-info">
                    <div class="price">Pay ₹100</div>
                    <div class="type">Get ₹200 Weekly</div>
                </div>
                <a href="https://rzp.io/rzp/HA3J194Z" target="_blank" class="pay-now-btn">Pay Now</a>
            </div>
        </div>

    </div>
        
    <script>
        function submitForm(event) {
            event.preventDefault();
            
            const name = document.getElementById("userName").value;
            const phone = document.getElementById("userPhone").value;
            const email = document.getElementById("userEmail").value;
            
            localStorage.setItem("user_name", name);
            localStorage.setItem("user_phone", phone);
            localStorage.setItem("user_email", email);
            
            document.getElementById("stepForm").classList.remove("active");
            document.getElementById("stepPayment").classList.add("active");
            
            let savedWallet = localStorage.getItem("user_wallet") || 0;
            document.getElementById("walletBalance").innerText = "₹" + savedWallet;
        }

        // Flexible Custom Promo Code Logic (User can type any code like PROTOINDIA)
        function applyPromoCode() {
            const codeInput = document.getElementById("promoInput").value.trim();
            const isClaimed = localStorage.getItem("promo_claimed");

            if(isClaimed === "true") {
                alert("❌ You have already used a promo code on this device!");
                return;
            }

            if(codeInput === "") {
                alert("❌ Please enter a valid promo code.");
                return;
            }

            // Generates random bonus between ₹50 to ₹400
            let randomBonus = Math.floor(Math.random() * (400 - 50 + 1)) + 50; 
            let currentWallet = parseInt(localStorage.getItem("user_wallet")) || 0;
            let newBalance = currentWallet + randomBonus;

            localStorage.setItem("user_wallet", newBalance);
            localStorage.setItem("promo_claimed", "true");

            document.getElementById("walletBalance").innerText = "₹" + newBalance;
            document.getElementById("promoInput").value = "";
            alert(`🎉 Promo Code Applied Successfully!\n\nCongratulations! ₹${randomBonus} bonus added to your Wallet.`);
        }
    </script>
</body>
</html>
